# CI do site: testa e compila a cada push e pull request; na main, publica a imagem no GHCR
# (ghcr.io/site-alzheimer/front-end), que a VM do IFCE baixa.
name: Testes e imagem

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  imagem:
    # Pull requests param nos testes: só a main vira imagem
    if: github.event_name != 'pull_request'
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # main = versão no ar; o hash do commit permite voltar a uma versão exata
          tags: |
            ghcr.io/site-alzheimer/front-end:main
            ghcr.io/site-alzheimer/front-end:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
