<header class="navbar" [class.is-hidden]="hidden()">
  <div class="navbar__inner container">
    <a class="navbar__brand" href="#inicio" (click)="selectSection('#inicio')">
      <span class="navbar__logo" aria-hidden="true">
        <img src="assets/icon/logo-neuroia.svg" alt="Logo">
      </span>
      <span class="navbar__name">NeuroIA</span>
    </a>

    <nav class="navbar__links" [class.is-open]="menuOpen()">
      @for (link of links; track link.href) {
        <a
          class="navbar__link"
          [class.is-active]="activeSection() === link.href.slice(1)"
          [href]="link.href"
          (click)="selectSection(link.href)"
        >
          {{ link.label | uppercase }}
        </a>
      }
    </nav>

    <button
      class="navbar__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menu de navegação"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
