# nginx de dentro do container do front: só arquivos estáticos, porta 8080.
# HTTPS, cabeçalhos de segurança e as rotas da API ficam no nginx da VM.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Atrás do proxy, redirecionamentos relativos (sem expor a porta 8080)
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos com hash no nome (main-XXXXXXXX.js): mudam de nome a cada versão,
    # então o navegador pode guardá-los por um ano
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # assets/ e favicon não têm hash: o navegador revalida a cada visita (ETag)
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Rotas do Angular (/, /analise): sempre o index.html, revalidado para pegar versões novas
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
